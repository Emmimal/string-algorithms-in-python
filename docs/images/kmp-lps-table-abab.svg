<rect x="1240" y="440" width="160" height="100" rx="16" fill="#F3F4F6" stroke="#6B7280" stroke-width="5"/>
<text x="1320" y="508" font-size="58" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">b</text>
<rect x="1240" y="550" width="160" height="100" rx="16" fill="#DCFCE7" stroke="#059669" stroke-width="5"/>
<text x="1320" y="618" font-size="58" text-anchor="middle" fill="#047857" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">2</text>
<text x="900" y="760" font-size="46" text-anchor="middle">How each value is found</text>
<rect x="40" y="800" width="1720" height="270" rx="22" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="3"/>
<text x="70" y="922" font-size="40">i = 0</text>
<text x="70" y="968" font-size="34" fill="#374151" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">"a"</text>
<rect x="330" y="880" width="100" height="100" rx="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="5"/>
<text x="380" y="948" font-size="52" text-anchor="middle" fill="#4B5563" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">a</text>
<text x="385" y="1036" font-size="30" text-anchor="middle" fill="#6B7280">only one letter</text>
<text x="880" y="900" font-size="34">No proper prefix exists</text>
<text x="880" y="946" font-size="34" fill="#4B5563">So lps[0] = 0</text>
<rect x="1470" y="870" width="260" height="110" rx="20" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="5"/>
<text x="1600" y="937" font-size="38" text-anchor="middle" fill="#4B5563" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">lps[0] = 0</text>
<rect x="40" y="1090" width="1720" height="270" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/>
<text x="70" y="1212" font-size="40">i = 1</text>
<text x="70" y="1258" font-size="34" fill="#374151" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">"ab"</text>
<rect x="330" y="1170" width="100" height="100" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/>
<text x="380" y="1238" font-size="52" text-anchor="middle" fill="#1E3A8A" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">a</text>
<rect x="440" y="1170" width="100" height="100" rx="16" fill="#FFEDD5" stroke="#EA580C" stroke-width="5"/>
<text x="490" y="1238" font-size="52" text-anchor="middle" fill="#9A3412" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">b</text>
<line x1="330" y1="1156" x2="430" y2="1156" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
<text x="380" y="1138" font-size="30" text-anchor="middle" fill="#1E3A8A">prefix</text>
<line x1="440" y1="1284" x2="540" y2="1284" stroke="#EA580C" stroke-width="8" stroke-linecap="round"/>
<text x="490" y="1326" font-size="30" text-anchor="middle" fill="#9A3412">suffix</text>
<text x="880" y="1190" font-size="34">prefix "a" vs suffix "b"</text>
<text x="880" y="1236" font-size="34" fill="#4B5563">Different, so lps[1] = 0</text>
<rect x="1470" y="1160" width="260" height="110" rx="20" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="5"/>
<text x="1600" y="1227" font-size="38" text-anchor="middle" fill="#4B5563" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">lps[1] = 0</text>
<rect x="40" y="1380" width="1720" height="270" rx="22" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="3"/>
<text x="70" y="1502" font-size="40">i = 2</text>
<text x="70" y="1548" font-size="34" fill="#374151" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">"aba"</text>
<rect x="330" y="1460" width="100" height="100" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/>
<text x="380" y="1528" font-size="52" text-anchor="middle" fill="#1E3A8A" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">a</text>
<rect x="440" y="1460" width="100" height="100" rx="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="5"/>
<text x="490" y="1528" font-size="52" text-anchor="middle" fill="#4B5563" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">b</text>
<rect x="550" y="1460" width="100" height="100" rx="16" fill="#FFEDD5" stroke="#EA580C" stroke-width="5"/>
<text x="600" y="1528" font-size="52" text-anchor="middle" fill="#9A3412" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">a</text>
<line x1="330" y1="1446" x2="430" y2="1446" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
<text x="380" y="1428" font-size="30" text-anchor="middle" fill="#1E3A8A">prefix</text>
<line x1="550" y1="1574" x2="650" y2="1574" stroke="#EA580C" stroke-width="8" stroke-linecap="round"/>
<text x="600" y="1616" font-size="30" text-anchor="middle" fill="#9A3412">suffix</text>
<text x="880" y="1480" font-size="34">prefix "a" vs suffix "a"</text>
<text x="880" y="1526" font-size="34" fill="#047857">Same, so lps[2] = 1</text>
<text x="880" y="1570" font-size="30" fill="#6B7280">Longer try: "ab" vs "ba" differ</text>
<rect x="1470" y="1450" width="260" height="110" rx="20" fill="#DCFCE7" stroke="#059669" stroke-width="5"/>
<text x="1600" y="1517" font-size="38" text-anchor="middle" fill="#047857" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">lps[2] = 1</text>
<rect x="40" y="1670" width="1720" height="270" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/>
<text x="70" y="1792" font-size="40">i = 3</text>
<text x="70" y="1838" font-size="34" fill="#374151" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">"abab"</text>
<rect x="330" y="1750" width="100" height="100" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/>
<text x="380" y="1818" font-size="52" text-anchor="middle" fill="#1E3A8A" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">a</text>
<rect x="440" y="1750" width="100" height="100" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/>
<text x="490" y="1818" font-size="52" text-anchor="middle" fill="#1E3A8A" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">b</text>
<rect x="550" y="1750" width="100" height="100" rx="16" fill="#FFEDD5" stroke="#EA580C" stroke-width="5"/>
<text x="600" y="1818" font-size="52" text-anchor="middle" fill="#9A3412" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">a</text>
<rect x="660" y="1750" width="100" height="100" rx="16" fill="#FFEDD5" stroke="#EA580C" stroke-width="5"/>
<text x="710" y="1818" font-size="52" text-anchor="middle" fill="#9A3412" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">b</text>
<line x1="330" y1="1736" x2="540" y2="1736" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
<text x="435" y="1718" font-size="30" text-anchor="middle" fill="#1E3A8A">prefix</text>
<line x1="550" y1="1864" x2="760" y2="1864" stroke="#EA580C" stroke-width="8" stroke-linecap="round"/>
<text x="655" y="1906" font-size="30" text-anchor="middle" fill="#9A3412">suffix</text>
<text x="880" y="1770" font-size="34">prefix "ab" vs suffix "ab"</text>
<text x="880" y="1816" font-size="34" fill="#047857">Same, so lps[3] = 2</text>
<text x="880" y="1860" font-size="30" fill="#6B7280">Longer try: "aba" vs "bab" differ</text>
<rect x="1470" y="1740" width="260" height="110" rx="20" fill="#DCFCE7" stroke="#059669" stroke-width="5"/>
<text x="1600" y="1807" font-size="38" text-anchor="middle" fill="#047857" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">lps[3] = 2</text>
<rect x="100" y="1980" width="1600" height="230" rx="26" fill="#ECFDF5" stroke="#059669" stroke-width="5"/>
<text x="900" y="2044" font-size="42" text-anchor="middle" fill="#047857">Why the table helps</text>
<text x="900" y="2100" font-size="32" text-anchor="middle">After matching "abab", a mismatch makes KMP jump to lps[3] = 2</text>
<text x="900" y="2148" font-size="32" text-anchor="middle">It keeps "ab" and never moves the text pointer backward</text>
<text x="900" y="2190" font-size="28" text-anchor="middle" fill="#374151">Search time O(n + m)  |  Table space O(m)</text>
</g>

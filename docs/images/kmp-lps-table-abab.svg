<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2270" width="1800" height="2270" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">KMP LPS table for the pattern abab</title>
<desc id="d">The LPS array for abab is 0, 0, 1, 2. For each position, the diagram highlights the prefix from the front and the suffix from the back that match: a matches a at index 2, and ab matches ab at index 3.</desc>
<rect width="1800" height="2270" fill="#FFFFFF"/>
<g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" fill="#111827">
<text x="900" y="90" font-size="58" text-anchor="middle">KMP LPS Table for "abab"</text>
<text x="900" y="145" font-size="32" text-anchor="middle" fill="#374151">LPS = longest proper prefix that is also a suffix</text>
<rect x="100" y="187" width="64" height="56" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/>
<text x="184" y="226" font-size="30">prefix (from the front)</text>
<rect x="640" y="187" width="64" height="56" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="5"/>
<text x="724" y="226" font-size="30">suffix (from the back)</text>
<text x="1180" y="226" font-size="30" fill="#374151">proper = not whole string</text>
<text x="900" y="330" font-size="42" text-anchor="middle">Final LPS table</text>
<text x="670" y="408" font-size="38" text-anchor="end">index</text>
<text x="670" y="503" font-size="38" text-anchor="end">pattern</text>
<text x="670" y="613" font-size="38" text-anchor="end">lps</text>
<text x="780" y="408" font-size="38" text-anchor="middle" fill="#6B7280">0</text>
<rect x="700" y="440" width="160" height="100" rx="16" fill="#F3F4F6" stroke="#6B7280" stroke-width="5"/>
<text x="780" y="508" font-size="58" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">a</text>
<rect x="700" y="550" width="160" height="100" rx="16" fill="#DCFCE7" stroke="#059669" stroke-width="5"/>
<text x="780" y="618" font-size="58" text-anchor="middle" fill="#047857" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">0</text>
<text x="960" y="408" font-size="38" text-anchor="middle" fill="#6B7280">1</text>
<rect x="880" y="440" width="160" height="100" rx="16" fill="#F3F4F6" stroke="#6B7280" stroke-width="5"/>
<text x="960" y="508" font-size="58" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">b</text>
<rect x="880" y="550" width="160" height="100" rx="16" fill="#DCFCE7" stroke="#059669" stroke-width="5"/>
<text x="960" y="618" font-size="58" text-anchor="middle" fill="#047857" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">0</text>
<text x="1140" y="408" font-size="38" text-anchor="middle" fill="#6B7280">2</text>
<rect x="1060" y="440" width="160" height="100" rx="16" fill="#F3F4F6" stroke="#6B7280" stroke-width="5"/>
<text x="1140" y="508" font-size="58" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">a</text>
<rect x="1060" y="550" width="160" height="100" rx="16" fill="#DCFCE7" stroke="#059669" stroke-width="5"/>
<text x="1140" y="618" font-size="58" text-anchor="middle" fill="#047857" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">1</text>

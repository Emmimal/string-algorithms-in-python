[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "string-algorithms-in-python"
version = "1.0.0"
description = "Code and tests for the EmiTechLogic guide: String Algorithms in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emmimal P Alexander" }]

[tool.setuptools]
packages = ["string_algorithms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
